<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tool factory</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f7f7f5;
  --surface: #fcfcfb;
  --ink: #141414;
  --muted: #6b6b68;
  --faint: #9a9a96;
  --line: #e2e2de;
  --wire: #14141440;
  --bad: #b4321f;
  --on-ink: #fafaf8;
  --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111110;
    --surface: #171716;
    --ink: #f1f1ee;
    --muted: #a3a39e;
    --faint: #75756f;
    --line: #2a2a28;
    --wire: #f1f1ee40;
    --bad: #f07a63;
    --on-ink: #111110;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font); }
button { font: inherit; color: inherit; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.muted { color: var(--muted); }
.bad { color: var(--bad); }
.mono { font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }

.shell { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
.side { border-right: 1px solid var(--line); padding: 22px 14px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; }
.brand { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 500; letter-spacing: -0.01em; padding: 0 6px 22px; }
.mark { width: 32px; height: 32px; background: var(--ink); color: var(--on-ink); display: grid; place-items: center; font-weight: 700; font-size: 17px; flex: none; }
.side .label { font-size: 12px; color: var(--faint); padding: 0 6px 6px; }
.side a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; color: var(--ink); text-decoration: none; font-size: 14px; }
.side a:hover { background: var(--line); }
.side a.on { background: var(--ink); color: var(--on-ink); box-shadow: 0 6px 18px #0000001f; }
.side a .n { margin-left: auto; font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
.side a.on .n { color: var(--on-ink); opacity: 0.7; }
.side .foot { margin-top: auto; font-size: 12px; color: var(--muted); padding: 0 6px; display: grid; gap: 8px; }

.main { min-width: 0; }
.top { display: flex; align-items: center; gap: 12px; height: 64px; padding: 0 28px; border-bottom: 1px solid var(--line); font-size: 13px; }
.crumb { color: var(--muted); }
.crumb b { color: var(--ink); font-weight: 500; }
.chip { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); padding: 7px 12px; font-size: 13px; white-space: nowrap; }
.chip.dark { background: var(--line); border-color: var(--line); }
.push { margin-left: auto; }
.pagehead { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; min-height: 64px; padding: 10px 28px; border-bottom: 1px solid var(--line); }
.pagehead h1 { font-size: 16px; font-weight: 500; margin: 0 auto 0 0; }

.problems { margin: 20px 28px 0; border: 1px solid var(--bad); padding: 12px 16px; color: var(--bad); font-size: 13px; }
.problems ul { margin: 6px 0 0; padding-left: 18px; color: var(--ink); }

.frame { position: relative; margin: 0 56px; border-left: 1px solid var(--line); border-right: 1px solid var(--line); padding: 28px; }
.rule { position: relative; border-top: 1px solid var(--line); }
.rule::before, .rule::after { content: ""; position: absolute; top: -8px; width: 15px; height: 15px; background: var(--ink); clip-path: polygon(50% 0, 58% 42%, 100% 50%, 58% 58%, 50% 100%, 42% 58%, 0 50%, 42% 42%); }
.rule::before { left: 49px; }
.rule::after { right: 49px; }

.kpis { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--line); background: var(--surface); }
.kpi { padding: 16px 20px 18px; border-left: 1px solid var(--line); min-width: 0; }
.kpi:first-child { border-left: 0; }
.kpi .l { font-size: 14px; color: var(--muted); }
.kpi .v { font-size: 34px; font-weight: 500; letter-spacing: -0.03em; line-height: 1.2; margin: 6px 0 12px; font-variant-numeric: tabular-nums; }
.kpi .s { font-size: 12px; color: var(--muted); margin-top: 8px; }
.ticks { height: 20px; border: 1px solid var(--ink); padding: 3px; }
.ticks i { display: block; height: 100%; min-width: 0; background: repeating-linear-gradient(90deg, var(--ink) 0 2px, transparent 2px 4px); }
.ticks.bad { border-color: var(--bad); }
.ticks.bad i { background: repeating-linear-gradient(90deg, var(--bad) 0 2px, transparent 2px 4px); }
.sources { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; color: var(--muted); margin-top: 10px; }

.stage { position: relative; display: grid; grid-template-columns: minmax(240px, 1fr) minmax(220px, 0.9fr) minmax(280px, 1fr); gap: 0; margin-top: 28px; }
.wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.wires path { fill: none; stroke: var(--wire); stroke-width: 1; transition: opacity 0.15s; }
.wires path.lit { stroke: var(--ink); stroke-width: 1.5; }
.wires path.dim { opacity: 0.12; }
.col-title { font-size: 12px; color: var(--faint); margin-bottom: 10px; }
.atoms { padding-left: 96px; }
.panel { padding-left: 28px; }
.panel .inner { position: sticky; top: 20px; }

.node { display: block; width: 100%; text-align: left; position: relative; z-index: 1; background: var(--surface); border: 1px solid var(--line); cursor: pointer; transition: opacity 0.15s, background 0.15s; }
.node:hover { border-color: var(--faint); }
.node[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); border-color: var(--ink); box-shadow: 0 8px 22px #00000024; }
.node[aria-pressed="true"] .stat, .node[aria-pressed="true"] .desc, .node[aria-pressed="true"] .tag { color: var(--on-ink); border-color: #ffffff40; }
.node[aria-pressed="true"] .bars span.on, .node[aria-pressed="true"] .health.ok { background: var(--on-ink); }
.node.dim { opacity: 0.35; }
.tool { padding: 14px 16px; margin-bottom: 10px; }
.tool .name { font-size: 18px; font-weight: 500; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; }
.tool .desc { color: var(--muted); font-size: 13px; margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.atom { padding: 9px 12px; margin-bottom: 8px; }
.atom .name { font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 8px; }
.port, .socket { position: absolute; width: 7px; height: 7px; background: var(--ink); }
.port { right: -4px; top: 22px; }
.socket { left: -4px; top: 14px; }
.node[aria-pressed="true"] .port, .node[aria-pressed="true"] .socket { background: var(--ink); outline: 1px solid var(--on-ink); }
.kind { font-size: 11px; color: var(--faint); margin: 14px 0 6px; }
.kind:first-of-type { margin-top: 0; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.tag { font-size: 11.5px; color: var(--muted); border: 1px solid var(--line); padding: 0 7px; }
.tag.warn, .tag.red { color: var(--bad); border-color: var(--bad); }
.health { width: 7px; height: 7px; flex: none; background: var(--ink); opacity: 0.25; }
.health.warn, .health.red { background: var(--bad); opacity: 1; }
.stat { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 2px 14px; font-size: 12px; color: var(--muted); margin-top: 8px; font-variant-numeric: tabular-nums; }
.stat b { font-weight: 500; }
.note { display: block; font-size: 12px; color: var(--bad); margin-top: 4px; }
.bars { display: inline-flex; align-items: flex-end; gap: 2px; height: 18px; margin-left: auto; }
.bars span { width: 5px; min-height: 2px; background: var(--line); display: flex; flex-direction: column-reverse; overflow: hidden; }
.bars span.on { background: var(--ink); }
.bars span i { display: block; background: var(--bad); }

.answer .who { display: flex; align-items: center; gap: 12px; }
.answer .who .mark { background: var(--surface); color: var(--ink); border: 1px solid var(--line); width: 40px; height: 40px; }
.answer .who b { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
.answer .lede { font-size: 16px; line-height: 1.5; margin: 14px 0; }
.answer dl { display: grid; grid-template-columns: auto 1fr; margin: 0; border: 1px solid var(--line); background: var(--surface); font-size: 13px; }
.answer dt, .answer dd { margin: 0; padding: 8px 12px; border-top: 1px solid var(--line); }
.answer dt:first-of-type, .answer dd:first-of-type { border-top: 0; }
.answer dt { color: var(--muted); }
.answer dd { text-align: right; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.answer .chart { margin: 14px 0 0; display: flex; }
.answer .chart .bars { height: 48px; margin: 0; flex: 1; justify-content: space-between; }
.answer .chart .bars span { width: auto; flex: 1; }
.answer .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.answer .chips button { border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; font-size: 12.5px; color: var(--muted); cursor: pointer; }
.answer .chips button:hover { color: var(--ink); border-color: var(--faint); }

.elsewhere { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); border: 1px solid var(--line); background: var(--surface); }
.elsewhere > div { padding: 16px 20px; border-left: 1px solid var(--line); }
.elsewhere > div:first-child { border-left: 0; }
.elsewhere .name { font-size: 16px; font-weight: 500; }
.elsewhere p { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
h2 { font-size: 13px; font-weight: 500; color: var(--muted); margin: 0 0 12px; }

.thread { display: grid; gap: 22px; margin-bottom: 22px; }
.thread:empty { display: none; }
.ask { justify-self: end; max-width: 80%; border: 1px solid var(--line); background: var(--surface); padding: 10px 14px; font-size: 13.5px; overflow-wrap: anywhere; }
.ask b { font-weight: 500; }
.answer.run { max-width: 860px; }
.answer.run .body { padding-left: 52px; }
.answer h3 { font-size: 13px; font-weight: 500; color: var(--muted); margin: 18px 0 8px; }
.answer ol, .answer ul { margin: 0; padding-left: 20px; }
.answer li { margin: 3px 0; }
.at { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-right: 8px; font-variant-numeric: tabular-nums; }
.segments { max-height: 340px; overflow: auto; border: 1px solid var(--line); background: var(--surface); padding: 10px 12px; font-size: 13px; }
.segments div { margin: 2px 0; }
.progress { font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; border-left: 1px solid var(--line); padding-left: 12px; margin-top: 12px; }
.error { border: 1px solid var(--bad); color: var(--bad); padding: 10px 14px; font-size: 13px; overflow-wrap: anywhere; }
.raw { font-family: var(--mono); font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; border: 1px solid var(--line); background: var(--surface); padding: 12px; max-height: 340px; overflow: auto; }
.composer .pick { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.composer .pick button { border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; font-size: 12.5px; color: var(--muted); cursor: pointer; }
.composer .pick button:hover { color: var(--ink); border-color: var(--faint); }
.composer .pick button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.composer .hint { font-size: 12.5px; color: var(--muted); margin: 0 0 10px; }
.hatch { border: 1px solid var(--line); padding: 14px; background: repeating-linear-gradient(-45deg, var(--line) 0 1px, transparent 1px 9px); }
.box { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); padding: 10px 10px 10px 16px; }
.box input { flex: 1; min-width: 0; border: 0; background: none; color: var(--ink); font: 16px var(--font); padding: 8px 0; outline: none; }
.box input::placeholder { color: var(--faint); }
.send { width: 44px; height: 44px; flex: none; display: grid; place-items: center; border: 0; background: var(--ink); color: var(--on-ink); cursor: pointer; box-shadow: 0 6px 16px #00000029; }
.send:disabled { opacity: 0.35; cursor: default; box-shadow: none; }
.extras { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; margin-top: 12px; font-size: 13px; color: var(--muted); }
.extras label { display: inline-flex; align-items: center; gap: 6px; }
.extras input[type="number"], .extras input[type="text"] { width: 120px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 13px var(--font); padding: 4px 8px; }

@media (max-width: 1100px) {
  .stage { grid-template-columns: 1fr minmax(200px, 0.9fr); }
  .panel { grid-column: 1 / -1; padding: 28px 0 0; }
  .kpis { grid-template-columns: 1fr 1fr; }
  .kpi:nth-child(3) { border-left: 0; }
  .kpi:nth-child(n + 3) { border-top: 1px solid var(--line); }
}
@media (max-width: 760px) {
  .shell { grid-template-columns: 1fr; }
  .side { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; border-right: 0; border-bottom: 1px solid var(--line); padding: 12px 16px; }
  .brand { padding: 0; margin-right: auto; }
  .side .label, .side .foot { display: none; }
  .top { padding: 0 16px; }
  .top .crumb { display: none; }
  .push { margin-left: 0; }
  .pagehead { padding: 10px 16px; }
  .frame { margin: 0; border: 0; padding: 20px 16px; }
  .rule::before, .rule::after { display: none; }
  .stage { grid-template-columns: 1fr; }
  .wires, .port, .socket { display: none; }
  .atoms { padding: 18px 0 0; }
  .problems { margin: 16px 16px 0; }
  .answer.run .body { padding-left: 0; }
  .ask { max-width: 100%; }
}
</style>
</head>
<body>
<div class="shell" id="app"></div>
<script id="status" type="application/json"></script>
<script>
const model = JSON.parse(document.getElementById('status').textContent || 'null');
const app = document.getElementById('app');
const HEALTH = { ok: 'Healthy', warn: 'Warning', red: 'Broken' };
const SOCKET = { into: 'Project', global: 'Global skill', bin: 'On PATH' };
const KINDS = ['transform', 'model', 'observe', 'act'];
const SVG = 'http://www.w3.org/2000/svg';

function h(tag, props, ...children) {
  const el = document.createElement(tag);
  for (const [key, value] of Object.entries(props ?? {})) {
    if (value === null || value === undefined) continue;
    if (key === 'class') el.className = value;
    else if (key.startsWith('on')) el.addEventListener(key.slice(2), value);
    else el.setAttribute(key, value);
  }
  for (const child of children.flat(Infinity)) {
    if (child === null || child === undefined || child === false) continue;
    el.append(child instanceof Node ? child : String(child));
  }
  return el;
}

const usd = (n) => (n === null ? 'unknown' : `$${n.toFixed(4)}`);
const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;
const counted = (n, word) => [h('b', null, n), ` ${word}${n === 1 ? '' : 's'}`];
const seconds = (ms) => (ms === null ? 'no runs' : ms < 1000 ? `${Math.round(ms)} ms` : `${(ms / 1000).toFixed(1)} s`);
const short = (day) => new Date(`${day}T00:00:00Z`).toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' });

function ago(iso) {
  if (!iso) return 'never';
  const min = Math.round((Date.now() - Date.parse(iso)) / 60000);
  if (min < 1) return 'just now';
  if (min < 60) return `${min} min ago`;
  if (min < 48 * 60) return `${Math.round(min / 60)} h ago`;
  return `${Math.round(min / 1440)} days ago`;
}

function logSummary({ lines, unreadable, firstUnreadable }) {
  if (lines === null) return 'unreadable';
  return unreadable ? `${plural(lines, 'line')} read, ${unreadable} unreadable from line ${firstUnreadable}` : plural(lines, 'line');
}

const healthTag = (level) => (level === 'ok' ? null : h('span', { class: `tag ${level}` }, HEALTH[level]));
const total = (d) => d.runs + (d.atomCalls ?? 0);
const failed = (d) => d.failed + (d.atomFailed ?? 0);
const notes = (row) => (row.health === 'ok' ? null : row.notes.map((n) => h('span', { class: 'note' }, n)));
const clock = (s) => {
  const t = Math.floor(s);
  const mmss = `${Math.floor((t % 3600) / 60)}:${String(t % 60).padStart(2, '0')}`;
  return t >= 3600 ? `${Math.floor(t / 3600)}:${mmss.padStart(5, '0')}` : mmss;
};
const ticks = (share, bad) => h('div', { class: `ticks${bad ? ' bad' : ''}`, role: 'img', 'aria-label': `${Math.round(share * 100)}%` }, h('i', { style: `width:${Math.min(1, share) * 100}%` }));

function unmetered(row) {
  if (row.kind === 'skill') return 'skill only, no runs or spend';
  if (row.runs === null) return 'runs unknown, the run log is unreadable';
  return null;
}

function bars(perDay) {
  const top = Math.max(1, ...perDay.map(total));
  return h('span', { class: 'bars', role: 'img', 'aria-label': `Runs and atom calls per day: ${perDay.map(total).join(', ')}` },
    perDay.map((d) => h('span', { class: total(d) ? 'on' : '', title: `${d.day}: ${plural(d.runs, 'run')}, ${plural(d.atomCalls, 'atom call')}, ${failed(d)} failed`, style: `height:${Math.max(6, (total(d) / top) * 100)}%` },
      failed(d) ? h('i', { style: `height:${(failed(d) / total(d)) * 100}%` }) : null)));
}

function everyDay() {
  return model.days.map((day, i) => model.tools.filter((t) => t.perDay).reduce((sum, t) => {
    const d = t.perDay[i];
    return { day, runs: sum.runs + d.runs, failed: sum.failed + d.failed, atomCalls: sum.atomCalls + d.atomCalls, atomFailed: sum.atomFailed + d.atomFailed };
  }, { day, runs: 0, failed: 0, atomCalls: 0, atomFailed: 0 }));
}

function toolStat(tool) {
  const none = unmetered(tool);
  if (none) return h('div', { class: 'stat' }, none);
  return h('div', { class: 'stat' },
    h('span', null, counted(total(tool), 'call')),
    h('span', { class: failed(tool) ? 'bad' : '' }, h('b', null, failed(tool)), ' failed'),
    h('span', null, usd(tool.spentUsd)),
    h('span', null, ago(tool.lastRunAt)),
    total(tool) ? bars(tool.perDay) : null);
}

function atomStat(atom) {
  const none = unmetered(atom);
  if (none) return h('div', { class: 'stat' }, none);
  return h('div', { class: 'stat' },
    h('span', null, counted(atom.runs, 'run')),
    atom.failed ? h('span', { class: 'bad' }, h('b', null, atom.failed), ' failed') : null,
    h('span', { class: atom.usedBy.length ? '' : 'bad' }, atom.usedBy.length ? `used by ${atom.usedBy.length}` : 'used by no tool'));
}

const rows = model ? [...model.tools, ...model.atoms] : [];
const counts = Object.fromEntries(Object.keys(HEALTH).map((level) => [level, rows.filter((r) => r.health === level).length]));
const related = new Map(rows.map((r) => [r.name, new Set([r.name, ...(r.uses ?? r.usedBy)])]));
const period = model ? `${model.days.length} days` : '';

function lede(row) {
  const none = unmetered(row);
  if (none) return `${row.name} has ${none}.`;
  const calls = total(row);
  const sentence = `${row.name} made ${plural(calls, row.type === 'tool' ? 'call' : 'run')} in the last ${period}`;
  if (!calls) return `${sentence}.`;
  return failed(row) ? `${sentence}, and ${failed(row)} failed.` : `${sentence}, and none failed.`;
}

function panelFor(name) {
  const who = (title) => h('div', { class: 'who' }, h('span', { class: 'mark' }, 'F'), h('b', null, title));
  if (!name) {
    const calls = model.calls;
    return [
      who('All tools'),
      h('p', { class: 'lede' }, calls
        ? `${plural(calls.runs, 'call')} in the last ${period}, ${calls.failed} failed. ${counts.ok} of ${rows.length} tools and atoms are healthy.`
        : 'Calls unknown, the run log is unreadable.'),
      calls ? h('div', { class: 'chart' }, bars(everyDay())) : null,
      h('div', { class: 'sources' }, h('span', null, `${short(model.days[0])} to ${short(model.days.at(-1))}, UTC`)),
      h('div', { class: 'chips' }, model.tools.filter((t) => t.uses.length).map((t) => h('button', { type: 'button', onclick: () => select(t.name) }, `What does ${t.name} call?`))),
    ];
  }
  const row = model.tools.find((t) => t.name === name) ?? model.atoms.find((a) => a.name === name);
  const tool = row.type === 'tool';
  const near = tool ? row.uses : row.usedBy;
  return [
    who(row.name),
    h('p', { class: 'lede' }, lede(row)),
    notes(row),
    h('p', { class: 'muted', style: 'font-size:13px;margin:0 0 14px' }, row.description),
    h('dl', null,
      h('dt', null, 'Kind'), h('dd', null, `${row.type}, ${row.kind}, ${row.status}`),
      h('dt', null, 'Health'), h('dd', { class: row.health === 'ok' ? '' : 'bad' }, HEALTH[row.health]),
      unmetered(row) ? null : [
        h('dt', null, 'Median'), h('dd', null, seconds(row.medianMs)),
        h('dt', null, `Spent, ${period}`), h('dd', null, usd(row.spentUsd)),
        h('dt', null, 'Last run'), h('dd', null, ago(row.lastRunAt)),
        row.atomCalls ? [h('dt', null, 'Direct atom calls'), h('dd', null, row.atomCalls)] : null,
      ],
      h('dt', null, 'Linked'), h('dd', null, row.links === null ? 'unknown' : row.links.map((l) => `${SOCKET[l.socket]} ${l.where}`).join('; ') || 'nowhere')),
    tool && !unmetered(row) && total(row) ? h('div', { class: 'chart' }, bars(row.perDay)) : null,
    h('div', { class: 'sources' }, h('span', null, `${tool ? 'Uses' : 'Used by'} ${plural(near.length, tool ? 'atom' : 'tool')}`)),
    h('div', { class: 'chips' }, tool && row.verbs.length ? h('button', { type: 'button', onclick: () => tryOut(row.name) }, `Try ${row.name}`) : null, near.map((n) => h('button', { type: 'button', onclick: () => select(n) }, n))),
  ];
}

const runnable = model ? model.tools.filter((t) => t.verbs.length) : [];
const trying = { tool: runnable[0], verb: runnable[0]?.verbs[0], busy: false };
let composer, thread;

function main(verb) {
  const { properties, required = [] } = verb.input;
  return required.find((name) => properties[name].type === 'string') ?? Object.keys(properties)[0];
}

function digest(d) {
  return [
    h('p', { class: 'lede' }, d.summary),
    d.chapters.length ? [h('h3', null, 'Chapters'), h('ol', null, d.chapters.map((c) => h('li', null, h('span', { class: 'at' }, clock(c.start)), c.title)))] : null,
    d.keyPoints.length ? [h('h3', null, 'Key points'), h('ul', null, d.keyPoints.map((k) => h('li', null, k)))] : null,
    d.visual ? [h('h3', null, 'On screen'), h('ul', null, d.visual.map((v) => h('li', null, h('span', { class: 'at' }, clock(v.start)), v.note)))] : null,
    h('div', { class: 'sources' }, h('span', null, `Source ${d.source}`), h('span', null, `${d.model}, ${usd(d.costUsd)}${d.cacheHit ? ', cached' : ''}`)),
    h('div', { class: 'sources' }, h('span', { class: 'mono' }, d.transcriptPath)),
  ];
}

function transcript(t) {
  return [
    h('p', { class: 'lede' }, `${plural(t.segments.length, 'segment')} of ${t.language} from ${t.method === 'captions' ? 'the captions' : 'speech recognition'}.`),
    h('div', { class: 'segments' }, t.segments.map((s) => h('div', null, h('span', { class: 'at' }, clock(s.start)), s.text))),
    h('div', { class: 'sources' }, h('span', null, `Source ${t.source}`), h('span', null, `${t.model}${t.cacheHit ? ', cached' : ''}`)),
  ];
}

function digestList(list) {
  return [
    h('p', { class: 'lede' }, `${plural(list.items.length, 'digest')}${list.failed.length ? `, ${list.failed.length} failed` : ''}.`),
    list.items.map((d) => [h('h3', null, d.source), digest(d)]),
    list.failed.length ? [h('h3', null, 'Failed'), list.failed.map((f) => h('div', { class: 'error' }, `${f.url}: ${f.error.code}, ${f.error.message}`))] : null,
  ];
}

const SHOW = { digest, transcript, 'digest-list': digestList };

function result(verb, output) {
  if (output?.error) return h('div', { class: 'error' }, `${output.error.code}: ${output.error.message}`);
  const show = SHOW[verb.output];
  try {
    if (show) return h('div', null, show(output));
  } catch {}
  return h('pre', { class: 'raw' }, JSON.stringify(output, null, 2));
}

function tryOut(name) {
  trying.tool = runnable.find((t) => t.name === name);
  trying.verb = trying.tool.verbs[0];
  drawComposer();
  document.getElementById('try').scrollIntoView({ behavior: 'smooth' });
  composer.querySelector('.box input')?.focus();
}

function sendIcon() {
  const svg = document.createElementNS(SVG, 'svg');
  svg.setAttribute('width', '20');
  svg.setAttribute('height', '20');
  svg.setAttribute('viewBox', '0 0 24 24');
  svg.innerHTML = '<path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>';
  return svg;
}

function drawComposer() {
  const { tool, verb } = trying;
  const lead = main(verb);
  const { properties, required = [] } = verb.input;
  const field = (name) => {
    const p = properties[name];
    if (p.type === 'boolean') return h('label', { title: p.description }, h('input', { type: 'checkbox', name }), name);
    return h('label', { title: p.description }, name, h('input', { type: p.type === 'integer' ? 'number' : 'text', name, min: p.type === 'integer' ? '1' : null, ...(required.includes(name) ? { required: '' } : {}) }));
  };
  const extras = Object.keys(properties).filter((name) => name !== lead);
  composer.replaceChildren(
    h('div', { class: 'pick', role: 'group', 'aria-label': 'Tool' }, runnable.map((t) => h('button', { type: 'button', 'aria-pressed': String(t === tool), onclick: () => { trying.tool = t; trying.verb = t.verbs[0]; drawComposer(); } }, t.name))),
    h('div', { class: 'pick', role: 'group', 'aria-label': 'Verb' }, tool.verbs.map((v) => h('button', { type: 'button', 'aria-pressed': String(v === verb), onclick: () => { trying.verb = v; drawComposer(); } }, v.name))),
    h('p', { class: 'hint' }, verb.description),
    h('div', { class: 'hatch' },
      h('div', { class: 'box' },
        h('input', { name: lead, required: '', autocomplete: 'off', placeholder: properties[lead].description, 'aria-label': `${tool.name} ${verb.name} ${lead}` }),
        h('button', { class: 'send', type: 'submit', 'aria-label': `Run ${tool.name} ${verb.name}`, ...(trying.busy ? { disabled: '' } : {}) },
          sendIcon()))),
    extras.length ? h('div', { class: 'extras' }, extras.map(field)) : '');
}

function inputFrom(form) {
  const { properties } = trying.verb.input;
  const input = {};
  for (const [name, p] of Object.entries(properties)) {
    const el = form.elements[name];
    if (!el) continue;
    if (p.type === 'boolean') {
      if (el.checked) input[name] = true;
    } else if (el.value.trim()) {
      input[name] = p.type === 'integer' ? Number(el.value) : el.value.trim();
    }
  }
  return input;
}

async function submit(e) {
  e.preventDefault();
  if (trying.busy) return;
  const { tool, verb } = trying;
  const input = inputFrom(e.target);
  const lead = input[main(verb)];
  if (!lead) return;
  trying.busy = true;
  drawComposer();
  const status = h('p', { class: 'lede muted' }, 'Running');
  const progress = h('div', { class: 'progress' });
  const body = h('div', { class: 'body' }, status, progress);
  const flags = Object.entries(input).filter(([name]) => name !== main(verb)).map(([name, v]) => (v === true ? ` --${name}` : ` --${name} ${v}`)).join('');
  thread.append(
    h('div', { class: 'ask' }, h('b', null, `${tool.name} ${verb.name}`), ` ${lead}${flags}`),
    h('div', { class: 'answer run' }, h('div', { class: 'who' }, h('span', { class: 'mark' }, 'F'), h('b', null, tool.name)), body));
  const began = performance.now();
  const tick = setInterval(() => (status.textContent = `Running, ${Math.round((performance.now() - began) / 1000)} s`), 1000);
  try {
    const res = await fetch(`/run/${encodeURIComponent(tool.name)}/${encodeURIComponent(verb.name)}`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(input) });
    if (!res.ok) throw new Error((await res.text()).trim());
    const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
    let buffer = '';
    let last = null;
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += value;
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines.filter(Boolean).map((l) => JSON.parse(l))) {
        if ('progress' in line) progress.textContent = (progress.textContent + line.progress).split('\n').slice(-6).join('\n');
        else last = line;
      }
    }
    const seconds = Math.round((performance.now() - began) / 1000);
    body.replaceChildren(result(verb, last?.output), h('div', { class: 'sources' }, h('span', null, `${last?.code === 0 ? 'Done' : 'Failed'} in ${seconds} s. Reload to see it in the counts.`)));
  } catch (err) {
    body.replaceChildren(h('div', { class: 'error' }, err.message));
  } finally {
    clearInterval(tick);
    trying.busy = false;
    drawComposer();
  }
}

let selected = null;
const nodes = new Map();
let wires, stage, panel;

function draw() {
  if (getComputedStyle(wires).display === 'none') return;
  const box = stage.getBoundingClientRect();
  const ends = new Map([...nodes].map(([name, el]) => {
    const r = el.querySelector('.port, .socket')?.getBoundingClientRect();
    return [name, r && { left: r.left - box.left, right: r.right - box.left, y: r.top - box.top + r.height / 2 }];
  }));
  wires.replaceChildren(...model.tools.flatMap((t) => t.uses.map((u) => {
    const a = { x: ends.get(t.name).right, y: ends.get(t.name).y };
    const b = { x: ends.get(u).left, y: ends.get(u).y };
    const mid = (a.x + b.x) / 2;
    const lit = selected && (selected === t.name || selected === u);
    const path = document.createElementNS(SVG, 'path');
    path.setAttribute('d', `M${a.x},${a.y} C${mid},${a.y} ${mid},${b.y} ${b.x},${b.y}`);
    path.setAttribute('class', lit ? 'lit' : selected ? 'dim' : '');
    return path;
  })));
}

function select(name) {
  selected = selected === name ? null : name;
  history.replaceState(null, '', selected ? `#${selected}` : location.pathname);
  const near = selected && related.get(selected);
  for (const [key, el] of nodes) {
    el.setAttribute('aria-pressed', String(key === selected));
    el.classList.toggle('dim', !!near && !near.has(key));
  }
  panel.replaceChildren(...panelFor(selected).flat(Infinity).filter(Boolean));
  draw();
}

function toolNode(tool) {
  const el = h('button', { class: 'node tool', type: 'button', 'data-tool': tool.name, 'aria-pressed': 'false', onclick: () => select(tool.name) },
    h('span', { class: 'name' }, h('span', { class: `health ${tool.health}`, title: HEALTH[tool.health] }), tool.name),
    h('span', { class: 'tags' }, h('span', { class: 'tag' }, tool.kind), h('span', { class: 'tag' }, tool.status), healthTag(tool.health)),
    h('span', { class: 'desc' }, tool.description),
    notes(tool),
    toolStat(tool),
    tool.uses.length ? h('span', { class: 'port' }) : null);
  nodes.set(tool.name, el);
  return el;
}

function atomNode(atom) {
  const el = h('button', { class: 'node atom', type: 'button', 'data-atom': atom.name, 'aria-pressed': 'false', onclick: () => select(atom.name) },
    h('span', { class: 'socket' }),
    h('span', { class: 'name' }, h('span', { class: `health ${atom.health}`, title: HEALTH[atom.health] }), atom.name, healthTag(atom.health)),
    notes(atom),
    atomStat(atom));
  nodes.set(atom.name, el);
  return el;
}

function render() {
  if (!model) {
    app.append(h('p', { style: 'padding:24px' }, 'No status model. Open this page through factory dashboard.'));
    return;
  }
  const { capUsd, spentTodayUsd } = model.budget;
  const share = capUsd && spentTodayUsd !== null ? spentTodayUsd / capUsd : 0;
  const sick = rows.length - counts.ok;
  const calls = model.calls;
  const groups = [...KINDS, ...new Set(model.atoms.map((a) => a.kind).filter((k) => !KINDS.includes(k)))]
    .map((kind) => [kind, model.atoms.filter((a) => a.kind === kind)]).filter(([, list]) => list.length);

  wires = document.createElementNS(SVG, 'svg');
  wires.setAttribute('class', 'wires');
  wires.setAttribute('aria-hidden', 'true');
  panel = h('div', { class: 'inner answer', 'aria-live': 'polite' });
  stage = h('div', { class: 'stage' },
    wires,
    h('section', { class: 'tools', 'aria-label': 'Tools' }, h('div', { class: 'col-title' }, `Tools, ${model.tools.length}`), model.tools.map(toolNode)),
    h('section', { class: 'atoms', 'aria-label': 'Atoms' }, h('div', { class: 'col-title' }, `Atoms, ${model.atoms.length}`),
      groups.map(([kind, list]) => [h('div', { class: 'kind' }, kind), list.map(atomNode)])),
    h('aside', { class: 'panel' }, panel));

  app.append(
    h('nav', { class: 'side' },
      h('div', { class: 'brand' }, h('span', { class: 'mark' }, 'F'), 'Factory'),
      h('div', { class: 'label' }, 'Main'),
      h('a', { href: '#', class: 'on', onclick: (e) => { e.preventDefault(); if (selected) select(selected); scrollTo(0, 0); } }, 'Wiring', h('span', { class: 'n' }, rows.length)),
      runnable.length ? h('a', { href: '#try', onclick: (e) => { e.preventDefault(); tryOut(trying.tool.name); } }, 'Try', h('span', { class: 'n' }, runnable.length)) : null,
      h('a', { href: '#elsewhere', onclick: (e) => { e.preventDefault(); document.getElementById('elsewhere').scrollIntoView(); } }, 'Elsewhere', h('span', { class: 'n' }, model.external.length)),
      h('div', { class: 'foot' }, h('div', null, 'Data home'), h('div', { class: 'mono' }, model.home), h('div', null, `Run log ${logSummary(model.log)}`))),
    h('div', { class: 'main' },
      h('div', { class: 'top' },
        h('span', { class: 'crumb' }, 'Factory', ' › ', h('b', null, 'Wiring')),
        h('span', { class: 'chip push' }, `${short(model.days[0])} to ${short(model.days.at(-1))}`),
        h('span', { class: 'chip' }, 'Reload to refresh')),
      h('div', { class: 'pagehead' }, h('h1', null, 'Wiring'),
        h('span', { class: 'chip' }, `${plural(model.tools.length, 'tool')}, ${plural(model.atoms.length, 'atom')}`),
        h('span', { class: `chip dark${sick ? ' bad' : ''}` }, sick ? `${sick} not healthy` : 'All healthy')),
      model.problems.length
        ? h('div', { class: 'problems', role: 'alert' }, `${plural(model.problems.length, 'problem')} found`,
          h('ul', null, model.problems.map((p) => h('li', null, h('span', { class: 'mono' }, p.path), ` ${p.message}`))))
        : null,
      h('section', { class: 'frame' },
        h('div', { class: 'kpis' },
          h('div', { class: 'kpi', 'data-tile': 'spend' }, h('div', { class: 'l' }, 'Spent today'), h('div', { class: 'v' }, usd(spentTodayUsd)),
            ticks(share, spentTodayUsd !== null && capUsd !== null && spentTodayUsd >= capUsd),
            h('div', { class: 's' }, capUsd === null ? 'Budget unreadable' : capUsd === 0 ? 'No model spend allowed' : `of the $${capUsd.toFixed(2)} daily budget`)),
          h('div', { class: 'kpi' }, h('div', { class: 'l' }, `Calls, ${period}`), h('div', { class: 'v' }, calls?.runs ?? 'unknown'), ticks(calls?.runs ? (calls.runs - calls.failed) / calls.runs : 0), h('div', { class: 's' }, calls?.runs ? `${calls.runs - calls.failed} succeeded` : 'Tool runs and direct atom calls')),
          h('div', { class: 'kpi' }, h('div', { class: 'l' }, 'Failed'), h('div', { class: `v${calls?.failed ? ' bad' : ''}` }, calls?.failed ?? 'unknown'),
            ticks(calls?.runs ? calls.failed / calls.runs : 0, calls?.failed), h('div', { class: 's' }, calls?.runs ? `${Math.round((calls.failed / calls.runs) * 100)}% of calls` : 'No calls')),
          h('div', { class: 'kpi' }, h('div', { class: 'l' }, 'Healthy'), h('div', { class: 'v' }, `${counts.ok}/${rows.length}`),
            ticks(rows.length ? counts.ok / rows.length : 0), h('div', { class: 's' }, sick ? `${counts.warn} warning, ${counts.red} broken` : 'Every tool and atom passes doctor'))),
        h('div', { class: 'sources' }, h('span', null, `Sources: ${plural(model.log.lines ?? 0, 'log line')}, ${plural(rows.length, 'manifest')}, ${model.days.length}-day window`)),
        stage),
      h('div', { class: 'rule' }),
      runnable.length ? [
        h('section', { class: 'frame', id: 'try', 'aria-label': 'Try a tool' },
          h('h2', null, 'Try a tool'),
          thread = h('div', { class: 'thread', 'aria-live': 'polite' }),
          composer = h('form', { class: 'composer', onsubmit: submit })),
        h('div', { class: 'rule' }),
      ] : null,
      h('section', { class: 'frame', id: 'elsewhere', 'aria-label': 'Tools in other repos' },
        h('h2', null, 'Tools in other repos'),
        model.external.length
          ? h('div', { class: 'elsewhere' }, model.external.map((t) => h('div', { 'data-external': t.name }, h('div', { class: 'name' }, t.name), h('div', { class: 'mono muted' }, t.where), h('p', null, t.description))))
          : h('p', { class: 'muted' }, 'external.json lists no tools.')),
      h('div', { class: 'rule' })));

  new ResizeObserver(draw).observe(stage);
  if (runnable.length) drawComposer();
  const start = decodeURIComponent(location.hash.slice(1));
  select(nodes.has(start) ? start : null);
}

document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && selected) select(selected); });
render();
performance.mark('rendered');
</script>
</body>
