<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Factory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light dark;
  --bg: #ffffff;
  --ink: #000000;
  --muted: #5d6370;
  --soft: #cdd1d8;
  --line: #e7e9ee;
  --well: #f3f4f6;
  --card: #ffffff;
  --blue: #2b62ef;
  --blue-ink: #3b74f6;
  --blue-wash: #eff6ff;
  --blue-chip: #dde8fd;
  --blue-edge: #bcd3fb;
  --bad: #d4342a;
  --bad-wash: #fdeeec;
  --warn: #b26a00;
  --warn-wash: #fdf3e2;
  --shadow: 0 1px 2px #0000000d, 0 12px 32px -8px #0000001f;
  --font: "Geist", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0c0d10;
    --ink: #f4f5f7;
    --muted: #9aa0ab;
    --soft: #4a4f59;
    --line: #23262d;
    --well: #16181d;
    --card: #121419;
    --blue: #7ea3ff;
    --blue-ink: #8fb0ff;
    --blue-wash: #121a2e;
    --blue-chip: #1b2847;
    --blue-edge: #2c4378;
    --bad: #ff7a6e;
    --bad-wash: #2a1513;
    --warn: #f0b154;
    --warn-wash: #2a2010;
    --shadow: 0 1px 2px #00000066, 0 12px 32px -8px #000000aa;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; scroll-padding-top: 80px; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--font); letter-spacing: -0.01em; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; letter-spacing: inherit; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.muted { color: var(--muted); }
.bad { color: var(--bad); }
.mono { font-family: var(--mono); font-size: 13px; letter-spacing: 0; overflow-wrap: anywhere; }

.top { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.top .in { max-width: 1240px; margin: 0 auto; height: 64px; padding: 0 32px; display: flex; align-items: center; gap: 36px; }
.brand { display: flex; align-items: center; gap: 12px; font-size: 26px; font-weight: 300; letter-spacing: 0.02em; text-decoration: none; color: var(--ink); }
.brand svg { flex: none; }
.top nav { display: flex; gap: 28px; }
.top nav a { color: var(--ink); text-decoration: none; font-size: 17px; }
.top nav a:hover { color: var(--blue); }
.top .when { margin-left: auto; font-size: 15px; color: var(--muted); }
.pill { display: inline-flex; align-items: center; gap: 8px; background: var(--blue-chip); color: var(--blue-ink); border-radius: 10px; padding: 8px 18px; font-size: 16px; font-weight: 500; text-decoration: none; border: 0; cursor: pointer; white-space: nowrap; }
.pill:hover { background: var(--blue-edge); }

.wrap { max-width: 1240px; margin: 0 auto; padding: 0 32px; }
.divider { border: 0; border-top: 1px solid var(--line); margin: 104px 0 0; }
.big { font-size: 60px; line-height: 1; font-weight: 600; letter-spacing: -0.05em; margin: 0; }
.big .soft { color: var(--soft); position: relative; }
.big .mark { color: var(--blue); background: var(--blue-chip); border-radius: 14px; padding: 0 0.12em; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.big .mark.bad { color: var(--bad); background: var(--bad-wash); }
h2.big { font-size: 48px; }
.say { font-size: 22px; line-height: 1.35; letter-spacing: -0.02em; margin: 22px 0 0; max-width: 34ch; }
.say b { font-weight: 600; }

.hero { padding: 96px 0 0; }
.problems { margin: 40px 0 0; background: var(--bad-wash); color: var(--bad); border-radius: 16px; padding: 16px 20px; font-size: 15px; }
.problems ul { margin: 6px 0 0; padding-left: 18px; color: var(--ink); }

.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-top: 64px; }
.kpi { background: var(--well); border: 3px solid var(--well); border-radius: 20px; padding: 24px 24px 22px; min-width: 0; }
.kpi.lead { background: var(--blue-wash); border-color: var(--blue-edge); }
.kpi .l { font-size: 15px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.kpi .v { font-size: 40px; font-weight: 600; letter-spacing: -0.05em; line-height: 1.1; margin: 14px 0 16px; font-variant-numeric: tabular-nums; }
.kpi .s { font-size: 14px; color: var(--muted); margin-top: 10px; }
.meter { height: 8px; border-radius: 99px; background: color-mix(in srgb, var(--ink) 8%, transparent); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 99px; background: var(--blue); }
.meter.bad i { background: var(--bad); }
.sources { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px; font-size: 14px; color: var(--muted); margin-top: 14px; }

.split { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); gap: 56px; align-items: start; padding-top: 96px; }
.composer .pick { display: grid; gap: 8px; margin-bottom: 14px; }
.pick .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.pick .group { width: 110px; font-size: 13px; color: var(--muted); }
.composer .pick button { border: 0; background: var(--well); border-radius: 10px; padding: 7px 14px; font-size: 15px; cursor: pointer; }
.composer .pick button:hover { background: var(--line); }
.composer .pick button[aria-pressed="true"] { background: var(--blue-chip); color: var(--blue-ink); font-weight: 500; }
.field { display: flex; align-items: center; gap: 10px; background: var(--blue-wash); border-radius: 16px; padding: 10px 10px 10px 14px; }
.field:focus-within { box-shadow: 0 0 0 3px var(--blue-edge); }
.token { flex: none; font-family: var(--mono); font-size: 15px; letter-spacing: 0; border-radius: 8px; padding: 3px 9px; background: var(--card); border: 1px solid var(--blue-edge); color: var(--blue-ink); }
.token.doc-verb { background: var(--warn-wash); border-color: color-mix(in srgb, var(--warn) 35%, transparent); color: var(--warn); }
.field input { flex: 1; min-width: 0; border: 0; background: none; font-family: var(--mono); font-size: 18px; letter-spacing: 0; padding: 8px 2px; outline: none; }
.field input::placeholder { color: var(--muted); opacity: 0.7; }
.send { width: 44px; height: 44px; flex: none; display: grid; place-items: center; border: 0; border-radius: 12px; background: var(--blue); color: #fff; cursor: pointer; }
.send:disabled { opacity: 0.4; cursor: default; }
.menu { margin-top: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 6px; }
.menu button { display: flex; align-items: baseline; gap: 10px; width: 100%; text-align: left; border: 0; background: none; border-radius: 10px; padding: 10px 12px; cursor: pointer; font-size: 17px; }
.menu button:hover { background: var(--well); }
.menu button[aria-pressed="true"] { background: var(--blue-wash); }
.menu .vn { font-weight: 600; flex: none; }
.menu .vd { color: var(--muted); font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.menu .vo { margin-left: auto; color: var(--muted); font-size: 13px; font-family: var(--mono); letter-spacing: 0; flex: none; }
.extras { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; margin-top: 14px; font-size: 15px; color: var(--muted); }
.extras label { display: inline-flex; align-items: center; gap: 8px; }
.extras input[type="checkbox"] { width: 17px; height: 17px; accent-color: var(--blue); }
.extras input[type="number"], .extras input[type="text"] { width: 110px; border: 0; background: var(--well); border-radius: 8px; padding: 5px 10px; font-size: 15px; }

.thread { display: grid; gap: 18px; margin-top: 48px; }
.thread:empty { display: none; }
.ask { justify-self: end; max-width: 75%; background: var(--blue-wash); color: var(--ink); border-radius: 16px 16px 4px 16px; padding: 10px 16px; font-size: 15px; overflow-wrap: anywhere; }
.ask b { font-weight: 600; color: var(--blue-ink); }
.reply { background: var(--well); border-radius: 20px; padding: 24px 28px; max-width: 920px; }
.reply .who { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px; margin-bottom: 10px; }
.reply .lede { font-size: 20px; line-height: 1.45; letter-spacing: -0.02em; margin: 0 0 6px; }
.reply h3 { font-size: 14px; font-weight: 500; color: var(--muted); margin: 20px 0 8px; }
.reply ol, .reply ul { margin: 0; padding-left: 22px; }
.reply li { margin: 4px 0; }
.at { font-family: var(--mono); font-size: 13px; letter-spacing: 0; color: var(--blue-ink); margin-right: 10px; font-variant-numeric: tabular-nums; }
.segments { max-height: 340px; overflow: auto; background: var(--card); border-radius: 12px; padding: 12px 14px; font-size: 15px; }
.segments div { margin: 3px 0; }
.progress { font-family: var(--mono); font-size: 13px; letter-spacing: 0; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 10px; }
.error { background: var(--bad-wash); color: var(--bad); border-radius: 12px; padding: 10px 14px; font-size: 15px; overflow-wrap: anywhere; margin: 6px 0; }
.raw { font-family: var(--mono); font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; background: var(--card); border-radius: 12px; padding: 14px; max-height: 340px; overflow: auto; }

.window { margin-top: 48px; background: var(--card); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow); padding: 28px; }
.stage { position: relative; display: grid; grid-template-columns: minmax(250px, 1fr) minmax(200px, 0.8fr) minmax(290px, 1fr); }
.wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.wires path { fill: none; stroke: var(--soft); stroke-width: 1.25; transition: opacity 0.15s; }
.wires path.lit { stroke: var(--blue); stroke-width: 2; }
.wires path.dim { opacity: 0.15; }
.col-title { font-size: 14px; color: var(--muted); margin: 0 0 12px; }
.atoms { padding-left: 88px; }
.panel { padding-left: 28px; }
.panel .inner { position: sticky; top: 88px; }

.node { display: block; width: 100%; text-align: left; position: relative; z-index: 1; cursor: pointer; transition: opacity 0.15s, background 0.15s, border-color 0.15s; }
.node.dim { opacity: 0.35; }
.service { background: var(--well); border: 3px solid var(--well); border-radius: 20px; padding: 18px 20px; margin-bottom: 12px; }
.service:hover { border-color: var(--line); }
.service[aria-pressed="true"] { background: var(--blue-wash); border-color: var(--blue-edge); }
.service .name { font-size: 24px; font-weight: 600; letter-spacing: -0.04em; display: flex; align-items: center; gap: 10px; }
.service .desc { color: var(--muted); font-size: 14px; line-height: 1.45; margin-top: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.atom { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; margin-bottom: 8px; }
.atom:hover { background: var(--well); }
.atom[aria-pressed="true"] { background: var(--blue-wash); border-color: var(--blue-edge); }
.atom .name { font-size: 15px; font-weight: 500; display: flex; align-items: center; gap: 8px; }
.port, .socket { position: absolute; width: 9px; height: 9px; border-radius: 50%; background: var(--card); border: 2px solid var(--soft); }
.port { right: -6px; top: 30px; }
.socket { left: -6px; top: 15px; }
.node[aria-pressed="true"] .port, .node[aria-pressed="true"] .socket { border-color: var(--blue); background: var(--blue); }
.kind { font-size: 13px; color: var(--muted); margin: 16px 0 6px; }
.kind:first-of-type { margin-top: 0; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.tag { font-size: 13px; color: var(--muted); background: var(--card); border-radius: 6px; padding: 1px 8px; }
.atom .tag { background: var(--well); }
.tag.warn { color: var(--warn); background: var(--warn-wash); }
.tag.red { color: var(--bad); background: var(--bad-wash); }
.health { width: 8px; height: 8px; border-radius: 50%; flex: none; background: #2fa66a; }
.health.warn { background: var(--warn); }
.health.red { background: var(--bad); }
.stat { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 2px 14px; font-size: 13px; color: var(--muted); margin-top: 10px; font-variant-numeric: tabular-nums; }
.stat b { font-weight: 600; color: var(--ink); }
.note { display: block; font-size: 13px; color: var(--bad); margin-top: 4px; }
.bars { display: inline-flex; align-items: flex-end; gap: 3px; height: 20px; margin-left: auto; }
.bars span { width: 6px; min-height: 2px; border-radius: 2px; background: var(--soft); opacity: 0.6; display: flex; flex-direction: column-reverse; overflow: hidden; }
.bars span.on { background: var(--blue); opacity: 1; }
.bars span i { display: block; background: var(--bad); }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); padding: 20px 22px; }
.card .head { display: flex; align-items: center; gap: 10px; font-size: 22px; font-weight: 600; letter-spacing: -0.04em; }
.card .lede { font-size: 17px; line-height: 1.45; margin: 12px 0; }
.card dl { display: grid; grid-template-columns: auto 1fr; margin: 0; font-size: 14px; }
.card dt, .card dd { margin: 0; padding: 8px 0; border-top: 1px solid var(--line); }
.card dt { color: var(--muted); padding-right: 12px; }
.card dd { text-align: right; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.card .chart { margin: 14px 0 0; display: flex; }
.card .chart .bars { height: 52px; margin: 0; flex: 1; justify-content: space-between; }
.card .chart .bars span { width: auto; flex: 1; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.chips button { border: 0; background: var(--well); border-radius: 10px; padding: 6px 12px; font-size: 14px; cursor: pointer; }
.chips button:hover { background: var(--line); }
.chips button.go { background: var(--blue-chip); color: var(--blue-ink); font-weight: 500; }

.elsewhere { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; margin-top: 48px; }
.elsewhere > div { background: var(--well); border-radius: 20px; padding: 24px; }
.elsewhere .name { font-size: 28px; font-weight: 600; letter-spacing: -0.05em; line-height: 1; }
.elsewhere .mono { color: var(--muted); margin-top: 10px; }
.elsewhere p { margin: 10px 0 0; font-size: 15px; }
.foot { padding: 64px 0 48px; font-size: 14px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 8px 28px; }

@media (max-width: 1100px) {
  .stage { grid-template-columns: 1fr minmax(200px, 0.8fr); }
  .panel { grid-column: 1 / -1; padding: 28px 0 0; }
  .kpis { grid-template-columns: 1fr 1fr; }
  .split { grid-template-columns: minmax(0, 1fr); gap: 32px; }
}
@media (max-width: 760px) {
  .top .in { padding: 0 16px; gap: 16px; }
  .top nav, .top .when { display: none; }
  .brand { margin-right: auto; font-size: 22px; }
  .wrap { padding: 0 16px; }
  .hero { padding-top: 48px; }
  .big { font-size: 40px; line-height: 1.08; }
  h2.big { font-size: 34px; }
  .say { font-size: 18px; }
  .divider { margin-top: 64px; }
  .split { padding-top: 56px; }
  .kpis { grid-template-columns: minmax(0, 1fr); margin-top: 40px; }
  .window { padding: 16px; border-radius: 18px; }
  .stage { grid-template-columns: minmax(0, 1fr); }
  .wires, .port, .socket { display: none; }
  .atoms { padding: 20px 0 0; }
  .menu .vd { display: none; }
  .pick .group { width: 100%; }
  .doc { padding: 20px; }
  .reply { padding: 18px; }
  .ask { max-width: 100%; }
}
.docs { display: grid; gap: 20px; margin-top: 40px; }
.doc { background: var(--well); border-radius: 20px; padding: 28px; min-width: 0; scroll-margin-top: 90px; }
.doc-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px; }
.doc-head h3 { font-size: 26px; letter-spacing: -0.03em; margin: 0; }
.doc .tag { font-size: 13px; color: var(--muted); background: var(--card); border-radius: 8px; padding: 2px 8px; }
.doc > p { margin: 8px 0 0; color: var(--muted); max-width: 80ch; }
.doc-verb { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-top: 16px; min-width: 0; }
.doc-verb-head { display: flex; align-items: center; gap: 12px; }
.doc-verb-head .mono { flex: 1; min-width: 0; font-size: 14px; }
.doc-verb-head .pill { padding: 5px 14px; font-size: 14px; }
.doc-verb > p { margin: 8px 0 0; }
.doc-verb h4 { margin: 18px 0 6px; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
.doc-verb h4 .mono { text-transform: none; color: var(--ink); }
.tbl { overflow-x: auto; }
.tbl table { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { text-align: left; font-weight: 500; color: var(--muted); padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line); }
.tbl td { padding: 7px 10px 7px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl td.mono { white-space: nowrap; }
@media (max-width: 760px) {
  .tbl table, .tbl tbody { display: block; }
  .tbl thead { display: none; }
  .tbl tr { display: grid; grid-template-columns: auto auto 1fr; gap: 2px 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .tbl td { border: 0; padding: 0; }
  .tbl td:nth-child(3) { color: var(--muted); }
  .tbl td:last-child { grid-column: 1 / -1; }
}
</style>
</head>
<body>
<div id="app"></div>
<script id="status" type="application/json"></script>
<script>
const model = JSON.parse(document.getElementById('status').textContent || 'null');
const app = document.getElementById('app');
const HEALTH = { ok: 'Healthy', warn: 'Warning', red: 'Broken' };
const SOCKET = { into: 'Project', global: 'Global skill', bin: 'On PATH' };
const KINDS = ['transform', 'model', 'observe', 'act'];
const SVG = 'http://www.w3.org/2000/svg';

function h(tag, props, ...children) {
  const el = document.createElement(tag);
  for (const [key, value] of Object.entries(props ?? {})) {
    if (value === null || value === undefined) continue;
    if (key === 'class') el.className = value;
    else if (key.startsWith('on')) el.addEventListener(key.slice(2), value);
    else el.setAttribute(key, value);
  }
  for (const child of children.flat(Infinity)) {
    if (child === null || child === undefined || child === false) continue;
    el.append(child instanceof Node ? child : String(child));
  }
  return el;
}

function icon(size, paths) {
  const svg = document.createElementNS(SVG, 'svg');
  svg.setAttribute('width', size);
  svg.setAttribute('height', size);
  svg.setAttribute('viewBox', '0 0 24 24');
  svg.setAttribute('aria-hidden', 'true');
  svg.innerHTML = paths;
  return svg;
}

const LOGO = '<circle cx="12" cy="12" r="11" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M7 8h3.5c2 0 2 8 4 8H17M7 16h3.5c2 0 2-8 4-8H17" fill="none" stroke="currentColor" stroke-width="1.2"/><circle cx="7" cy="8" r="1.3" fill="currentColor"/><circle cx="7" cy="16" r="1.3" fill="currentColor"/><circle cx="17" cy="8" r="1.3" fill="currentColor"/><circle cx="17" cy="16" r="1.3" fill="currentColor"/>';
const SEND = '<path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';

const usd = (n) => (n === null ? 'unknown' : `$${n.toFixed(4)}`);
const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;
const counted = (n, word) => [h('b', null, n), ` ${word}${n === 1 ? '' : 's'}`];
const seconds = (ms) => (ms === null ? 'no runs' : ms < 1000 ? `${Math.round(ms)} ms` : `${(ms / 1000).toFixed(1)} s`);
const short = (day) => new Date(`${day}T00:00:00Z`).toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' });

function ago(iso) {
  if (!iso) return 'never';
  const min = Math.round((Date.now() - Date.parse(iso)) / 60000);
  if (min < 1) return 'just now';
  if (min < 60) return `${min} min ago`;
  if (min < 48 * 60) return `${Math.round(min / 60)} h ago`;
  return `${Math.round(min / 1440)} days ago`;
}

function logSummary({ lines, unreadable, firstUnreadable }) {
  if (lines === null) return 'unreadable';
  return unreadable ? `${plural(lines, 'line')} read, ${unreadable} unreadable from line ${firstUnreadable}` : plural(lines, 'line');
}

const healthTag = (level) => (level === 'ok' ? null : h('span', { class: `tag ${level}` }, HEALTH[level]));
const total = (d) => d.runs + (d.atomCalls ?? 0);
const failed = (d) => d.failed + (d.atomFailed ?? 0);
const notes = (row) => (row.health === 'ok' ? null : row.notes.map((n) => h('span', { class: 'note' }, n)));
const clock = (s) => {
  const t = Math.floor(s);
  const mmss = `${Math.floor((t % 3600) / 60)}:${String(t % 60).padStart(2, '0')}`;
  return t >= 3600 ? `${Math.floor(t / 3600)}:${mmss.padStart(5, '0')}` : mmss;
};

const runnable = rows.filter((r) => r.verbs.length && r.guard !== 'confirm');

function main(verb) {

function tryOut(name, verbName) {

function drawComposer() {
  const { service, verb } = trying;
  const lead = main(verb);
  const { properties, required = [] } = verb.input;
  const field = (name) => {
    const p = properties[name];
    if (p.type === 'boolean') return h('label', { title: p.description }, h('input', { type: 'checkbox', name }), name);
    return h('label', { title: p.description }, name, h('input', { type: p.type === 'integer' ? 'number' : 'text', name, min: p.type === 'integer' ? '1' : null, ...(required.includes(name) ? { required: '' } : {}) }));
  };
  const extras = Object.keys(properties).filter((name) => name !== lead);
  composer.replaceChildren(
    h('div', { class: 'pick', role: 'group', 'aria-label': 'Microservice or atom' }, [['microservice', 'Microservices'], ['atom', 'Atoms']].map(([type, label]) => {

    })),
    h('div', { class: 'field' },

      h('span', { class: 'token verb' }, verb.name),
      h('input', { name: lead, required: '', autocomplete: 'off', placeholder: properties[lead].description, 'aria-label': `${service.name} ${verb.name} ${lead}` }),

    h('div', { class: 'menu', role: 'group', 'aria-label': 'Verb' }, service.verbs.map((v) => h('button', { type: 'button', 'aria-pressed': String(v === verb), title: v.description, onclick: () => { trying.verb = v; drawComposer(); } },
      h('span', { class: 'vn' }, v.name), h('span', { class: 'vd' }, v.description), h('span', { class: 'vo' }, v.output)))),
    extras.length ? h('div', { class: 'extras' }, extras.map(field)) : '');
}

function inputFrom(form) {
  const { properties } = trying.verb.input;
  const input = {};
  for (const [name, p] of Object.entries(properties)) {
    const el = form.elements[name];
    if (!el) continue;
    if (p.type === 'boolean') {
      if (el.checked) input[name] = true;
    } else if (el.value.trim()) {
      input[name] = p.type === 'integer' ? Number(el.value) : el.value.trim();
    }
  }
  return input;
}

async function submit(e) {
  e.preventDefault();
  if (trying.busy) return;
  const { service, verb } = trying;
  const input = inputFrom(e.target);
  const lead = input[main(verb)];
  if (!lead) return;
  trying.busy = true;
  drawComposer();
  const status = h('p', { class: 'lede muted' }, 'Running');
  const progress = h('div', { class: 'progress' });
  const body = h('div', null, status, progress);
  const flags = Object.entries(input).filter(([name]) => name !== main(verb)).map(([name, v]) => (v === true ? ` --${name}` : ` --${name} ${v}`)).join('');
  thread.append(
    h('div', { class: 'ask' }, h('b', null, `${service.name} ${verb.name}`), ` ${lead}${flags}`),
    h('div', { class: 'reply' }, h('div', { class: 'who' }, icon(18, LOGO), service.name), body));
  const began = performance.now();
  const tick = setInterval(() => (status.textContent = `Running, ${Math.round((performance.now() - began) / 1000)} s`), 1000);
  try {
    const res = await fetch(`/run/${encodeURIComponent(service.name)}/${encodeURIComponent(verb.name)}`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(input) });
    if (!res.ok) throw new Error((await res.text()).trim());
    const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
    let buffer = '';
    let last = null;
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += value;
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines.filter(Boolean).map((l) => JSON.parse(l))) {
        if ('progress' in line) progress.textContent = (progress.textContent + line.progress).split('\n').slice(-6).join('\n');
        else last = line;
      }
    }
    const took = Math.round((performance.now() - began) / 1000);
    body.replaceChildren(result(verb, last?.output), h('div', { class: 'sources' }, h('span', null, `${last?.code === 0 ? 'Done' : 'Failed'} in ${took} s. Reload to see it in the counts.`)));
  } catch (err) {
    body.replaceChildren(h('div', { class: 'error' }, err.message));
  } finally {
    clearInterval(tick);
    trying.busy = false;
    drawComposer();
  }
}

            h('div', null,

              h('p', { class: 'say' }, 'Pick a microservice or an atom, then a verb. Runs go through the same budget and land in the run log.')),
            composer = h('form', { class: 'composer', onsubmit: submit })),
          thread = h('div', { class: 'thread', 'aria-live': 'polite' })),
      ] : null,
      h('hr', { class: 'divider' }),
      h('section', { id: 'wiring', 'aria-label': 'Wiring' },
        h('h2', { class: 'big', style: 'padding-top:96px' }, 'The wiring. ', h('span', { class: 'soft' }, 'Click a microservice to see what it calls.')),
        h('div', { class: 'window' }, stage)),
      h('hr', { class: 'divider' }),
      h('section', { id: 'docs', 'aria-label': 'Docs' },
        h('h2', { class: 'big', style: 'padding-top:96px' }, 'The docs. ', h('span', { class: 'soft' }, 'Every verb, its input, and its output, read from the manifests.')),
        h('div', { class: 'docs' }, rows.filter((r) => r.verbs.length).map(doc))),
      h('hr', { class: 'divider' }),
      h('section', { id: 'elsewhere', 'aria-label': 'Microservices in other repos' },
        h('h2', { class: 'big', style: 'padding-top:96px' }, 'Elsewhere. ', h('span', { class: 'soft' }, 'Microservices that live in other repos.')),
        model.external.length
          ? h('div', { class: 'elsewhere' }, model.external.map((t) => h('div', { 'data-external': t.name }, h('div', { class: 'name' }, t.name), h('div', { class: 'mono' }, t.where), h('p', null, t.description))))
          : h('p', { class: 'say muted' }, 'external.json lists nothing.')),
      h('footer', { class: 'foot' }, h('span', null, 'Data home ', h('span', { class: 'mono' }, model.home)), h('span', null, `Run log ${logSummary(model.log)}`))));

  new ResizeObserver(draw).observe(stage);
  if (runnable.length) drawComposer();
  const start = decodeURIComponent(location.hash.slice(1));
  select(nodes.has(start) ? start : null);
}

document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && selected) select(selected); });
render();
performance.mark('rendered');
</script>
